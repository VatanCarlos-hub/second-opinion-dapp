<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Medical Triage</title>

<style>
body {
  background:#0a0a0a;
  color:#f0f0f0;
  font-family: monospace;
  padding:20px;
  max-width:700px;
  margin:auto;
}
input, textarea, select {
  width:100%;
  margin-bottom:10px;
  padding:10px;
  background:#111;
  color:#fff;
  border:1px solid #333;
}
button {
  width:100%;
  padding:14px;
  background:#0F6E56;
  color:white;
  border:none;
  cursor:pointer;
}
.status { margin-top:10px; font-size:13px; }
.result { margin-top:20px; padding:15px; border:1px solid #0F6E56; }
.badge { padding:5px 10px; display:inline-block; margin-top:10px; }
.URGENT { background:red; }
.SOON { background:orange; }
.MONITOR { background:green; }
.warning {
  font-size:12px;
  color:#aaa;
  border-top:1px solid #222;
  margin-top:15px;
  padding-top:10px;
}
</style>
</head>

<body>

<h2>AI Medical Triage (Non-Diagnostic)</h2>

<p style="font-size:12px;color:#888;">
This tool provides a risk-oriented AI triage only. It does NOT provide medical diagnosis.
</p>

<input id="age" type="number" placeholder="Age (1–120)">
<select id="gender">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<textarea id="symptoms" placeholder="Describe symptoms clearly..."></textarea>

<button id="btn">Run Triage</button>

<div class="status" id="status"></div>

<div class="result" id="result" style="display:none;">
  <div id="text"></div>
  <div id="level"></div>
  <div id="tx"></div>
</div>

<div class="warning">
⚠ This system uses probabilistic AI outputs. Results may be incomplete or incorrect.  
Always consult a licensed physician.
</div>

<script type="module">
import { createClient } from 'https://esm.sh/genlayer-js@latest';
import { studionet } from 'https://esm.sh/genlayer-js@latest/chains';

const CONTRACT = '0x0d384ff1Ae51d6d4DefD30e49B8891FF3d802202';

let client, user;

const status = document.getElementById('status');
const resultBox = document.getElementById('result');

function validate(age, symptoms) {
  if (!age || age < 1 || age > 120) return "Invalid age";
  if (!symptoms || symptoms.length < 10) return "Symptoms too short";
  return null;
}

async function connect() {
  if (!window.ethereum) throw "MetaMask required";
  const acc = await ethereum.request({ method:'eth_requestAccounts' });
  user = acc[0];
  client = createClient({ chain: studionet, account:user });
}

async function pollResult() {
  for (let i=0;i<15;i++) {
    try {
      const v = await client.readContract({
        address: CONTRACT,
        functionName: 'get_verdict',
        args: [user]
      });

      if (v && v.startsWith("{")) {
        return JSON.parse(v);
      }
    } catch(e){}
    await new Promise(r=>setTimeout(r,5000));
  }
  throw "Timeout waiting for result";
}

document.getElementById('btn').onclick = async () => {
  const age = Number(document.getElementById('age').value);
  const gender = document.getElementById('gender').value;
  const symptoms = document.getElementById('symptoms').value;

  const err = validate(age, symptoms);
  if (err) {
    status.textContent = "❌ " + err;
    return;
  }

  try {
    await connect();

    status.textContent = "Sending...";

    const tx = await client.writeContract({
      address: CONTRACT,
      functionName: 'submit_consultation',
      args: [symptoms, String(age), gender, "0","0","","",""],
      value: 0n
    });

    status.textContent = "Waiting for AI consensus...";

    const verdict = await pollResult();

    // Erwartetes Format:
    // { "summary": "...", "risk": "URGENT|SOON|MONITOR" }

    document.getElementById('text').innerText = verdict.summary;

    const lvl = document.getElementById('level');
    lvl.innerHTML = verdict.risk;
    lvl.className = "badge " + verdict.risk;

    document.getElementById('tx').innerHTML =
      "Onchain TX: " + tx;

    resultBox.style.display = "block";
    status.textContent = "✅ Done";

  } catch(e) {
    status.textContent = "❌ " + e;
  }
};
</script>

</body>
</html>
